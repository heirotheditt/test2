name: Tailscale Native SSH

on:
  workflow_dispatch:

jobs:
  ssh-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_KEY }}
          args: --ssh

      - name: Show SSH Info
        run: |
          echo "Tailscale IP:"
          tailscale ip -4
          echo
          echo "SSH command:"
          echo "ssh runner@$(tailscale ip -4)"

      - name: Keep Runner Alive
        run: tail -f /dev/null
